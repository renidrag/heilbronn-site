# Continuous deploy, pull-based: every push to main builds the site and
# uploads dist/ as a tarball on the rolling "site" release. The server polls
# that release every 5 minutes (server/site-pull.sh in tejstead/tejstead.com,
# run by cron) and syncs it into /srv/www/math, so a merged PR is live within
# ~10 minutes. No server credentials exist on GitHub; the box only makes
# outbound HTTPS.
name: publish-site

on:
  push:
    branches: [main]
  # Auto-merged PRs (merged by the Actions token) do not emit push events
  # that trigger workflows, so a schedule catches them: the cheap check job
  # compares HEAD against the published build and skips when nothing changed.
  # Note: GitHub registers this schedule only when this file changes on main;
  # after a repo recreate, touch this file or the cron never fires.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        run: |
          published=$(curl -fsSL --max-time 30 \
            "https://github.com/${{ github.repository }}/releases/download/site/site.sha" \
            || echo none)
          if [ "$published" = "${{ github.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "HEAD already published — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the records feed reads data/canonical history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m build 2> >(tee build.stderr >&2)

      - name: Flag entries a merge tried to lower
        # ingest keeps the committed canonical when a source directory was
        # overwritten with a lower-valued configuration (e.g. a submission
        # verified against an older main and merged after a better one landed
        # in the same directory). Make that visible instead of silent.
        run: |
          if grep -q "REGRESSION" build.stderr; then
            grep "REGRESSION" build.stderr | while IFS= read -r line; do
              echo "::warning title=submission overwrote a better record::$line"
            done
            { echo "## Overwritten records kept by ingest"; echo; echo '```';
              grep "REGRESSION" build.stderr; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit regenerated canonical data (if ingest changed it)
        id: commit
        # Keeps the committed data/canonical/ in sync with what the deployed
        # site was built from (e.g. after a submission PR merges). Pushes made
        # with the workflow token do not trigger workflows, so no loop.
        run: |
          if ! git diff --quiet data/canonical; then
            git config user.name "site-publish[bot]"
            git config user.email "site-publish@users.noreply.github.com"
            git add data/canonical
            git commit -m "canonical: regenerate after merge"
            # A concurrent run (push + schedule overlap) may have already
            # pushed the same regeneration. main has moved past this build,
            # so leave publishing to the run that sees the newer HEAD.
            if ! git push; then
              git fetch origin main
              if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
                echo "::notice::main moved during this run; skipping publish (a newer run handles it)"
                echo "stale=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit 1
            fi
          fi

      - name: Publish dist/ to the rolling release
        if: steps.commit.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C dist -czf site.tar.gz .
          git rev-parse HEAD > site.sha
          gh release view site >/dev/null 2>&1 || gh release create site \
            --prerelease --title "site build (rolling)" \
            --notes "Latest build of main. Pulled by the server every 5 minutes — see server/site-pull.sh in tejstead/tejstead.com. Not a versioned release."
          gh release upload site site.tar.gz site.sha --clobber
