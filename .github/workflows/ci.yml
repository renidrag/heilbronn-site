name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the records feed reads data/canonical history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt pytest
      - run: .venv/bin/python -m pytest tests/ -q
      - run: node --test tests/test_verifier_js.mjs
      - run: .venv/bin/python -m build
